name: web

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip web rather than the workflow, so the required check still passes
  # (scripts/code-changed.sh).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: anything besides docs?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "code=$(scripts/code-changed.sh "$BASE")" | tee -a "$GITHUB_OUTPUT"

  web:
    needs: changes
    # Runs unless changes said docs only: if changes failed, this must not pass by skipping.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: check out
        uses: actions/checkout@v4

      - name: set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: set up node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: bridge and reader tests
        run: node --test "test/*.test.ts"

      - name: committed reader .js matches web/src
        run: pnpm check-build
