name: swift

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip swift rather than the workflow, so the required check still passes
  # (scripts/code-changed.sh).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: anything besides docs?
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "code=$(scripts/code-changed.sh "$BASE")" | tee -a "$GITHUB_OUTPUT"

  swift:
    needs: changes
    # Runs unless changes said docs only: if changes failed, this must not pass by skipping.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: check out
        uses: actions/checkout@v4

      - name: select the newest xcode 26
        id: xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" | tee -a "$GITHUB_OUTPUT"
          echo "image=$ImageVersion" | tee -a "$GITHUB_OUTPUT"

      # The resolved packages, their build products and the SDK module cache, saved by main and
      # restored everywhere. The checkout gives every tracked file a new mtime, so gloss's own
      # modules always rebuild: only the dependencies and the module cache are reused. The key
      # changes with the runner image, the Xcode build and Package.resolved.
      - name: restore the swiftpm cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build
            !.build/arm64-apple-macosx/debug/index
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.image }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.image }}-${{ steps.xcode.outputs.build }}-

      - name: build the app, the cli and the tests
        # pipefail: through tee, a failed build would pass this step and main would cache it.
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | tee build.log

      - name: save the swiftpm cache
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .build
            !.build/arm64-apple-macosx/debug/index
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: fail on compiler warnings in Sources/ or Tests/
        run: |
          grep -E "warning:" build.log | grep -F -e "$PWD/Sources/" -e "$PWD/Tests/" | sort -u > warnings.txt || true
          if [ -s warnings.txt ]; then
            cat warnings.txt
            echo "::error::compiler warnings in Sources/ or Tests/ (zero-warning policy)"
            exit 1
          fi

      - name: swift tests
        run: swift test --skip-build

      - name: cli smoke test (the real binary on a real library)
        run: scripts/cli-smoke.sh
